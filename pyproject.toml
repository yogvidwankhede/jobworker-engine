[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-worker"
version = "0.1.0"
description = "Autonomous cloud job application worker"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "pyairtable>=2.3",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "jinja2>=3.1",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worker = "worker.cli:app"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.setuptools.package-data]
worker = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
